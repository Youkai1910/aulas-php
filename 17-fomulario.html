<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>

<body>
    <div class="container">
        <h1>Formulário HTML e processamento externo com PHP</h1>
        <hr>
        <!-- sempre use metodo post para formulários em geral -->
        <form action="17-processamento.php" method="post">
            <div class="mb-3">
                <label class="form-label" for="nome">Nome:</label>
                <input class="form-control" type="text" name="nome" id="nome">
            </div>
            <div class="mb-3">
                <label class="form-label" for="email">E-mail:</label>
                <input class="form-control" type="email" name="email" id="email">
            </div>
            <div class="mb-3">
                <label class="form-label" for="idade">Idade:</label>
                <input class="form-control" type="number" name="idade" id="idade" min="0" max="120">
            </div>

            <div class="form-check">
                <p class="mb-2">Interesses:</p>

                <div class="form-check"><input class="form-check-input" type="checkbox" name="interesses[]" id="html"
                        value="html">
                    <label for="html" class="form-check-label">HTML</label>
                </div>

                <div class="form-check"><input class="form-check-input" type="checkbox" name="interesses[]" id="css"
                        value="css">
                    <label for="css" class="form-check-label">CSS</label>
                </div>

                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="interesses[]" id="javascript"
                        value="javascript">
                    <label for="javascript" class="form-check-label">JavaScript</label>
                </div>

            </div>
            <div class="mb-3">
                <p class="mb-2">Deseja receber informativos ?</p>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="informativos" id="sim" value="sim">
                    <label for="sim" class="form-check-label">Sim</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="informativos" id="nao" value="nao">
                    <label for="nao" class="form-check-label">Não</label>
                </div>
            </div>
            <div class="mb-3">
                <label for="mensagem" class="form-label">Mensagem:</label>
                <textarea class="form-control" name="mensagem" id="mensagem" rows="6"></textarea>
            </div>

            <button type="submit" class="btn btn-primary">Enviar dados</button>
        </form>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
